<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bereken je resterende recup uren met de VCET-calculator.">
  <meta name="keywords" content="recup uren, VCET, calculator, rustdagen">
  <title>VCET Recup Calculator</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R9DG11SG16"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R9DG11SG16');
  </script>
  <style>
    :root {
      --color-bg: #f0f2f5;
      --color-surface: #ffffff;
      --color-text: #1a1d23;
      --color-text-light: #6b7280;
      --color-border: #d1d5db;
      --color-primary: #003da5;
      --color-primary-hover: #002d7f;
      --color-primary-light: #e8f0ff;
      --color-accent: #ffc000;
      --color-error: #dc2626;
      --color-error-light: #fee2e2;
      --color-success: #059669;
      --color-success-light: #ecfdf5;
      --color-warning: #d97706;
      --color-warning-light: #fef3c7;
      --color-info: #0891b2;
      --color-info-light: #ecf8ff;
      --spacing-xs: 0.5rem;
      --spacing-sm: 0.75rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0f2f5 0%, #e8ecf1 100%);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: var(--spacing-md) var(--spacing-md) var(--spacing-lg);
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin-top: var(--spacing-md);
    }

    header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }

    .logo {
      margin-bottom: var(--spacing-md);
      display: flex;
      justify-content: center;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: var(--color-primary);
      border-radius: var(--radius-md);
      position: relative;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .logo-badge::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 28px;
      height: 28px;
      background: var(--color-accent);
      border-radius: 0 var(--radius-md) 0 50%;
    }

    .logo-text {
      font-size: 2rem;
      font-weight: 700;
      color: white;
      letter-spacing: -0.05em;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--color-primary);
    }

    .subtitle {
      font-size: 0.8125rem;
      color: var(--color-text-light);
      font-weight: 400;
    }

    .card {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--spacing-md);
    }

    .form-group {
      margin-bottom: var(--spacing-md);
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 0.375rem;
      color: var(--color-text);
    }

    .label-hint {
      display: block;
      font-size: 0.75rem;
      color: var(--color-text-light);
      font-weight: 400;
      margin-top: 0.25rem;
      line-height: 1.4;
    }

    input {
      width: 100%;
      padding: 0.5rem var(--spacing-md);
      font-size: 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background-color: var(--color-surface);
      color: var(--color-text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: 'Inter', sans-serif;
    }

    input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-light);
    }

    input::placeholder {
      color: var(--color-text-light);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-lg);
    }

    button {
      padding: 0.625rem var(--spacing-lg);
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--color-text-light);
      border: 1px solid var(--color-border);
      font-size: 0.875rem;
      padding: 0.5rem var(--spacing-md);
    }

    .btn-secondary:hover {
      background-color: #f9fafb;
      border-color: var(--color-text-light);
      color: var(--color-text);
    }

    .btn-secondary:focus-visible {
      outline: 2px solid var(--color-border);
      outline-offset: 2px;
    }

    .result-container {
      margin-top: var(--spacing-md);
      min-height: 0;
      overflow: hidden;
    }

    .result {
      background-color: var(--color-success-light);
      border: 1px solid var(--color-success);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      animation: slideDown 0.3s ease;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result.error {
      background-color: var(--color-error-light);
      border-color: var(--color-error);
    }

    .result.warning {
      background-color: var(--color-warning-light);
      border-color: var(--color-warning);
    }

    .result.at-minimum {
      background-color: var(--color-warning-light);
      border-color: var(--color-warning);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-breakdown {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
      padding-bottom: var(--spacing-md);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .result-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--spacing-md);
      align-items: center;
      font-size: 0.9375rem;
    }

    .result-row-label {
      color: var(--color-text-light);
      font-weight: 500;
    }

    .result-row-value {
      font-weight: 600;
      text-align: right;
      color: var(--color-text);
    }

    .result-row-value.info {
      color: var(--color-info);
    }

    .result-main {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .result-main-label {
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .result-main-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .result-main-subtitle {
      font-size: 0.875rem;
      margin-top: var(--spacing-sm);
      line-height: 1.5;
    }

    .result.success .result-main-label {
      color: var(--color-success);
    }

    .result.success .result-main-value {
      color: var(--color-success);
    }

    .result.error .result-main-label {
      color: var(--color-error);
    }

    .result.error .result-main-value {
      color: var(--color-error);
    }

    .result.warning .result-main-label {
      color: var(--color-warning);
    }

    .result.warning .result-main-value {
      color: var(--color-warning);
    }

    .result.at-minimum .result-main-label {
      color: var(--color-warning);
    }

    .result.at-minimum .result-main-value {
      color: var(--color-warning);
    }

    .share-link {
      text-align: center;
      margin-top: var(--spacing-md);
      font-size: 0.75rem;
    }

    .share-link button {
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
    }

    @media (max-width: 640px) {
      body {
        padding: var(--spacing-sm) var(--spacing-sm) var(--spacing-md);
      }

      .container {
        max-width: 100%;
      }

      h1 {
        font-size: 1.25rem;
      }

      .card {
        padding: var(--spacing-md);
      }

      .button-group {
        grid-template-columns: 1fr 1fr;
        gap: var(--spacing-sm);
      }

      button {
        padding: 0.5rem var(--spacing-sm);
        font-size: 0.875rem;
      }

      .btn-secondary {
        padding: 0.5rem var(--spacing-sm);
        font-size: 0.8125rem;
      }

      .result-main-value {
        font-size: 1.25rem;
      }
    }

    /* Print styles */
    @media print {
      body {
        background-color: white;
      }

      .card {
        box-shadow: none;
        border: 1px solid var(--color-border);
      }

      button {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-badge" title="VCET">
          <div class="logo-text">V</div>
        </div>
      </div>
      <h1>VCET Recup</h1>
      <p class="subtitle">Bereken je resterende rustdagen</p>
    </header>

    <main>
      <form class="card" id="calculatorForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="saldo">Huidig recupsaldo</label>
          <input
            type="text"
            id="saldo"
            placeholder="bijv. 86:03 of 86.03 (of −2:04)"
            pattern="-?\d{1,3}:[0-5][0-9]|-?\d{1,3}\.[0-5][0-9]"
            required
            oninput="validateInput(this)"
            aria-describedby="saldoHint"
            autocomplete="off"
          >
          <span class="label-hint" id="saldoHint">Voer in als uu:mm of uu.mm. Negatieve waarden mogelijk (bijv. −2:04)</span>
        </div>

        <div class="form-group">
          <label for="dagen">Openstaande rustdagen</label>
          <input
            type="number"
            id="dagen"
            placeholder="aantal dagen"
            min="0"
            step="1"
            value="0"
            required
            oninput="validateInput(this)"
            aria-describedby="dagenHint"
            autocomplete="off"
          >
          <span class="label-hint" id="dagenHint">Voer het aantal openstaande rustdagen in</span>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-primary">Bereken</button>
          <button type="button" class="btn-secondary" onclick="handleReset()">Wissen</button>
        </div>
      </form>

      <div class="result-container">
        <div class="result" id="result" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>

      <div class="share-link">
        <button type="button" class="btn-secondary" onclick="shareUrl()">
          🔗 Delen
        </button>
      </div>
    </main>
  </div>

  <script>
    // ===== HULPFUNCTIES VOOR MINUUTBEREKENINGEN =====

    /**
     * Zet tijd-string (uu:mm of uu.mm, incl. negatief) om naar minuten
     */
    function parseTimeToMinutes(timeStr) {
      // Controleer op negatief teken
      const isNegative = timeStr.startsWith('-');
      const cleanStr = timeStr.replace('-', '');
      
      const separator = cleanStr.includes(':') ? ':' : '.';
      const parts = cleanStr.split(separator);
      
      if (parts.length !== 2) return null;
      
      const hours = parseInt(parts[0], 10);
      const minutes = parseInt(parts[1], 10);
      
      if (isNaN(hours) || isNaN(minutes) || minutes >= 60) {
        return null;
      }
      
      let totalMinutes = hours * 60 + minutes;
      if (isNegative) {
        totalMinutes = -totalMinutes;
      }
      
      return totalMinutes;
    }

    /**
     * Zet minuten om naar uu:mm formaat (incl. negatief)
     */
    function formatMinutesToTime(totalMinutes) {
      const isNegative = totalMinutes < 0;
      const absMinutes = Math.abs(totalMinutes);
      const hours = Math.floor(absMinutes / 60);
      const mins = absMinutes % 60;
      const sign = isNegative ? '−' : '';
      return `${sign}${hours}u${mins.toString().padStart(2, '0')}`;
    }

    /**
     * Zet minuten om naar dagen/uren/minuten formaat
     * Basis: 1 dag = 456 minuten (7u36)
     */
    function formatMinutesToDayFormat(totalMinutes) {
      const minutesPerDay = 456; // 7u36
      const isNegative = totalMinutes < 0;
      const absMinutes = Math.abs(totalMinutes);
      
      const days = Math.floor(absMinutes / minutesPerDay);
      const remaining = absMinutes % minutesPerDay;
      const hours = Math.floor(remaining / 60);
      const mins = remaining % 60;
      
      const sign = isNegative ? '−' : '';
      return `${sign}${days}d, ${hours}h, ${mins.toString().padStart(2, '0')}m`;
    }

    // ===== VALIDATIE =====

    function validateInput(input) {
      if (input.id === 'saldo') {
        const valid = input.value.match(/-?\d{1,3}:[0-5][0-9]|-?\d{1,3}\.[0-5][0-9]/) !== null;
        input.setCustomValidity(valid ? '' : 'Gebruik uu:mm of uu.mm (bijv. 86:03 of −2:04)');
      } else if (input.id === 'dagen') {
        const valid = input.value >= 0;
        input.setCustomValidity(valid ? '' : 'Rustdagen moeten 0 of hoger zijn');
      }
    }

    // ===== BEREKENING (HERZIEN VOOR GERESERVEERDE UREN) =====

    function bereken() {
      const saldoInput = document.getElementById('saldo').value.trim();
      const rustdagen = parseInt(document.getElementById('dagen').value) || 0;

      // Parse saldo naar minuten (nu ook negatief mogelijk)
      const saldoMinutes = parseTimeToMinutes(saldoInput);
      
      if (saldoMinutes === null) {
        showResult('Voer de tijd in als uu:mm of uu.mm (bijv. 86:03 of −2:04)', 'error');
        return;
      }

      // Bereken gereserveerde uren voor rustdagen
      // 1 rustdag = 456 minuten (7u36)
      const minutesPerRestDay = 456;
      const gereserveerdMinutes = rustdagen * minutesPerRestDay;

      // Bereken vrij beschikbaar recupsaldo
      const vrijMinutes = saldoMinutes - gereserveerdMinutes;

      // Bepaal status en toon resultaat
      if (vrijMinutes < 0) {
        // ROOD: Negatief/Tekort
        const tekortMinutes = Math.abs(vrijMinutes);
        showResultWithBreakdown(
          saldoMinutes,
          gereserveerdMinutes,
          vrijMinutes,
          'error',
          `Je hebt ${formatMinutesToTime(tekortMinutes)} te veel opgepakt voor ${rustdagen} rustdag${rustdagen !== 1 ? 'en' : ''}.`
        );
      } else if (vrijMinutes === 0) {
        // ORANJE: Minimumsaldo bereikt
        showResultWithBreakdown(
          saldoMinutes,
          gereserveerdMinutes,
          vrijMinutes,
          'at-minimum',
          `Je bereikt exact het minimumsaldo voor ${rustdagen} rustdag${rustdagen !== 1 ? 'en' : ''}. Geen vrije recup beschikbaar.`
        );
      } else {
        // GROEN: Vrij beschikbaar
        showResultWithBreakdown(
          saldoMinutes,
          gereserveerdMinutes,
          vrijMinutes,
          'success',
          ''
        );
      }
    }

    // ===== UI/UX FUNCTIES =====

    function showResultWithBreakdown(saldoMinutes, gereserveerdMinutes, vrijMinutes, type, warning) {
      const resultEl = document.getElementById('result');
      resultEl.className = `result ${type} show`;

      let html = `
        <div class="result-breakdown">
          <div class="result-row">
            <div class="result-row-label">Totaal recupsaldo:</div>
            <div class="result-row-value info">${formatMinutesToTime(saldoMinutes)}</div>
          </div>
          <div class="result-row">
            <div class="result-row-label">Gereserveerd voor rustdagen:</div>
            <div class="result-row-value info">${formatMinutesToTime(gereserveerdMinutes)}</div>
          </div>
        </div>
        <div class="result-main">
          <div class="result-main-label">${type === 'error' ? 'Te veel opgepakt' : type === 'at-minimum' ? 'Minimumsaldo bereikt' : 'Vrij beschikbaar'}</div>
          <div class="result-main-value">${formatMinutesToTime(vrijMinutes)}</div>
      `;

      if (warning) {
        html += `<div class="result-main-subtitle">${warning}</div>`;
      }

      html += `</div>`;

      resultEl.innerHTML = html;
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showResult(message, type = 'error') {
      const resultEl = document.getElementById('result');
      resultEl.className = `result ${type} show`;
      resultEl.innerHTML = `<div class="result-main"><div class="result-main-value">${message}</div></div>`;
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function handleSubmit(event) {
      event.preventDefault();
      const form = event.target;

      if (!form.checkValidity()) {
        showResult('Controleer je invoer alsjeblieft', 'error');
        return;
      }

      bereken();
    }

    function handleReset() {
      document.getElementById('calculatorForm').reset();
      document.getElementById('result').classList.remove('show');
      document.getElementById('saldo').focus();
    }

    function shareUrl() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const resultEl = document.getElementById('result');
        resultEl.className = 'result show';
        resultEl.innerHTML = '<div class="result-main"><div class="result-main-value">Link gekopieerd! 🔗</div></div>';
        resultEl.style.backgroundColor = 'var(--color-primary-light)';
        resultEl.style.borderColor = 'var(--color-primary)';

        setTimeout(() => {
          resultEl.classList.remove('show');
        }, 2000);
      }).catch(() => {
        showResult('Kon link niet kopieëren', 'error');
      });
    }

    // Auto-focus on first input
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('saldo').focus();
    });

    // Enter-toets support
    document.getElementById('dagen').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        bereken();
      }
    });
  </script>
</body>
</html>
